# afterstage default configuration (DGX Spark profile).
# Override any key with a user file: `afterstage --config my.yaml ...` or `<project>/config.yaml`.
# Every service here must be on this machine or your LAN: afterstage refuses public endpoints
# unless `privacy.allow_remote: true` is set explicitly.

privacy:
  allow_remote: false        # refuse non-local LLM/ComfyUI URLs (keeps everything on-device)
  watermark: true            # visible "AI-generated" badge on the final video
  watermark_text: "AI-generated"
  metadata_tag: true         # embed a provenance comment in the output file

# Local LLM used to write the screenplay. Any OpenAI-compatible server works:
# Ollama (default), vLLM, llama.cpp server, SGLang, TensorRT-LLM.
llm:
  backend: openai            # openai | template (offline deterministic writer, for tests)
  base_url: http://127.0.0.1:11434/v1
  model: qwen3:32b
  api_key: local
  temperature: 0.7
  max_tokens: 8192
  timeout: 600
  unload_after_use: true     # ask Ollama to free memory before diffusion stages run

# Local vision-language model for scene / appearance captions.
vlm:
  backend: openai            # openai | none
  base_url: http://127.0.0.1:11434/v1
  model: qwen3-vl:8b
  api_key: local
  timeout: 300

analysis:
  max_scenes: 24
  scene_threshold: 27.0      # PySceneDetect ContentDetector threshold
  face_backend: insightface  # insightface | opencv | none
  face_sample_fps: 2.0
  face_min_size: 64          # px, ignore tiny crowd faces
  face_cluster_threshold: 0.45   # cosine similarity to join a cluster
  max_members: 8
  min_member_screen_time: 1.0    # seconds
  asr_backend: whisper       # whisper | none
  asr_model: openai/whisper-large-v3-turbo
  separation_backend: demucs # demucs | none  (isolates vocals from concert music)
  device: cuda

writer:
  target_seconds: 90         # rough runtime of the generated segment
  max_shots: 30
  repair_attempts: 3
  language: ko               # default spoken language; lines may mix in English
  include_bridge: true       # first generated shot morphs from the clip's last frame

tts:
  backend: chatterbox        # chatterbox | dummy
  device: cuda
  exaggeration: 0.5
  cfg_weight: 0.5
  temperature: 0.8
  sample_rate: 24000
  pad_seconds: 0.25          # breathing room appended to each line

comfy:
  url: http://127.0.0.1:8188
  timeout: 7200              # seconds per job
  free_after_stage: true

# Rendering profiles. `draft` is for iterating on the script; `final` for the real thing.
render:
  backend: comfy             # comfy | dummy (ffmpeg placeholders, no GPU needed)
  profile: draft
  identity_check: true       # re-roll keyframes whose faces don't match the cast
  identity_threshold: 0.35
  identity_retries: 2
  profiles:
    draft:
      width: 832
      height: 480
      keyframe_steps: 4      # Qwen-Image-Edit-2511 + Lightning LoRA
      keyframe_cfg: 1.0
      keyframe_lightning: true
      talk_steps: 6          # InfiniteTalk + lightx2v distill LoRA
      broll_steps: 4         # Wan2.2 I2V + lightx2v 4-step LoRAs
      broll_lightning: true
    final:
      width: 1280
      height: 720
      keyframe_steps: 40
      keyframe_cfg: 4.0
      keyframe_lightning: false
      talk_steps: 8
      broll_steps: 20
      broll_lightning: false

# Model filenames as they appear in ComfyUI/models/<folder>/ (see scripts/models.yaml).
models:
  keyframe_unet: qwen_image_edit_2511_fp8mixed.safetensors
  keyframe_clip: qwen_2.5_vl_7b_fp8_scaled.safetensors
  keyframe_vae: qwen_image_vae.safetensors
  keyframe_lora: Qwen-Image-Edit-2511-Lightning-4steps-V1.0-bf16.safetensors
  wan_clip: umt5_xxl_fp8_e4m3fn_scaled.safetensors
  wan_vae: wan_2.1_vae.safetensors
  talk_unet: Wan2_1-I2V-14B-480p_fp8_e4m3fn_scaled_KJ.safetensors
  talk_lora: lightx2v_I2V_14B_480p_cfg_step_distill_rank64_bf16.safetensors
  talk_patch: wan2.1_infiniteTalk_single_fp16.safetensors
  talk_audio_encoder: wav2vec2-chinese-base_fp16.safetensors
  talk_vae: Wan2_1_VAE_bf16.safetensors
  broll_unet_high: wan2.2_i2v_high_noise_14B_fp8_scaled.safetensors
  broll_unet_low: wan2.2_i2v_low_noise_14B_fp8_scaled.safetensors
  broll_lora_high: wan2.2_i2v_lightx2v_4steps_lora_v1_high_noise.safetensors
  broll_lora_low: wan2.2_i2v_lightx2v_4steps_lora_v1_low_noise.safetensors
  music_unet: acestep_v1.5_xl_turbo_bf16.safetensors
  music_vae: ace_1.5_vae.safetensors
  music_clip1: qwen_0.6b_ace15.safetensors
  music_clip2: qwen_4b_ace15.safetensors

edit:
  fps: 25
  width: 1280
  height: 720
  include_source: true       # final cut = source clip + generated segment
  crossfade: 0.0             # seconds; the bridge shot already starts on the last frame
  music: true
  music_volume: 0.18
  burn_subtitles: true
  subtitle_font_size: 34
  crf: 18
